name: Bom dia varejo no WhatsApp

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só testar (não envia)"
        type: boolean
        default: false
      listar_grupos:
        description: "Só listar meus grupos e seus IDs (não gera boletim)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bom-dia-whatsapp
  cancel-in-progress: false

jobs:
  boletim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar e enviar boletim
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
          GREEN_ID_INSTANCE: ${{ secrets.GREEN_ID_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_DESTINOS: ${{ secrets.WHATSAPP_DESTINOS }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          INCLUIR_LINKS: ${{ vars.INCLUIR_LINKS }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          LISTAR_GRUPOS: ${{ inputs.listar_grupos && '1' || '0' }}
        run: python noticias_whatsapp.py

      - name: Salvar histórico (evita repetir notícias)
        if: success() && inputs.listar_grupos != true
        run: |
          git config user.name "bom-dia-bot"
          git config user.email "bom-dia-bot@users.noreply.github.com"
          git add historico.json
          git diff --cached --quiet || git commit -m "histórico $(TZ=America/Sao_Paulo date +%F)"
          git push
